<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan Halaman...</title>
    
    <!-- Redirect via Meta Refresh (0 detik) -->
    <meta http-equiv="refresh" content="0; url=https://babay.web.id/refund">

    <!-- Redirect via JavaScript -->
    <script>
        window.location.replace("https://babay.web.id/refund");
    </script>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #334155;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a.btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 20px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        a.btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Sedang Mengalihkan...</h2>
        <p>Anda sedang dialihkan ke halaman formulir/informasi refund.</p>
        <p>Jika halaman tidak berpindah secara otomatis, silakan klik tombol di bawah ini:</p>
        <a class="btn" href="https://babay.web.id/refund">Klik di Sini untuk Melanjutkan</a>
    </div>
</body>
</html>
