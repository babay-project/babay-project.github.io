<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 NS Editor: Secure Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; overflow: hidden; }
        
        /* --- LOGIN OVERLAY (LAYAR KUNCI) --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.95);
            z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .login-box {
            background: #161b22; padding: 30px; border: 1px solid #30363d; border-radius: 10px;
            width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-box h2 { color: #58a6ff; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 12px; color: #8b949e; }
        .input-group input { 
            width: 100%; box-sizing: border-box; padding: 10px; 
            background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; outline: none;
        }
        .input-group input:focus { border-color: #58a6ff; }
        .btn-login {
            width: 100%; padding: 12px; background: #238636; color: white; border: none; 
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .btn-login:hover { background: #2ea043; }
        .error-msg { color: #ff7b72; font-size: 13px; margin-top: 15px; display: none; }

        /* --- UI UTAMA (Sama seperti sebelumnya) --- */
        .sidebar { width: 280px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #30363d; }
        .btn-refresh { background: #1f6feb; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 10px; width: 100%; }
        
        .file-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .file-list li { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #21262d; font-size: 13px; display: flex; align-items: center; }
        .file-list li:hover { background: #1f2428; color: #58a6ff; }
        .file-list li.active { background: #1f6feb; color: white; border-left: 4px solid #a371f7; }

        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .tabs { display: flex; background: #010409; border-bottom: 1px solid #30363d; }
        .tab-btn { flex: 1; background: transparent; border: none; padding: 15px; color: #8b949e; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #f0f6fc; border-bottom-color: #f78166; background: #0d1117; }
        .toolbar { padding: 10px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        
        .view-container { flex: 1; display: none; overflow: hidden; }
        .view-container.active { display: flex; flex-direction: column; }

        textarea { flex: 1; background: #0d1117; color: #7ee787; border: none; padding: 20px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; outline: none; }
        
        .table-wrapper { flex: 1; overflow: auto; padding: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th, td { border: 1px solid #30363d; padding: 8px 12px; text-align: left; white-space: nowrap; }
        th { background: #21262d; color: #f0f6fc; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background: #161b22; }
        tr:hover { background: #232830; }
        .num { color: #79c0ff; }

        .btn-save { background: #238636; color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔐 GitHub Access</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="inpUser" value="babay-project">
            </div>
            <div class="input-group">
                <label>Repository Name</label>
                <input type="text" id="inpRepo" value="babay-project.github.io">
            </div>
            <div class="input-group">
                <label>Folder (Akhiri dengan /)</label>
                <input type="text" id="inpFolder" value="lib/">
            </div>
            <div class="input-group">
                <label style="color:#58a6ff; font-weight:bold;">Personal Access Token (PAT)</label>
                <input type="password" id="inpToken" placeholder="ghp_XXXXXXXXXXXXXXXXXXXX">
            </div>
            <button class="btn-login" onclick="validateAndConnect()" id="btnLogin">Verifikasi & Masuk 🚀</button>
            <div class="error-msg" id="loginError">Token Salah atau Repo Tidak Ditemukan!</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; color:#58a6ff;">📂 GUDANG .BIN</h2>
            <small id="repoDisplay" style="color:#8b949e;">-</small>
            <button class="btn-refresh" onclick="fetchFileList()">🔄 SCAN FOLDER</button>
        </div>
        <ul class="file-list" id="fileList"></ul>
    </div>

    <div class="main">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('editor')">📝 EDITOR</button>
            <button class="tab-btn" onclick="switchTab('preview')">👁️ TABEL</button>
        </div>
        <div class="toolbar">
            <div id="currentFile" style="font-weight:bold; color:#79c0ff;">Menunggu Akses...</div>
            <button class="btn-save" onclick="pushToGitHub()" id="saveBtn" disabled>SAVE KE GITHUB</button>
        </div>
        <div id="view-editor" class="view-container active">
            <textarea id="editor" placeholder="Silakan login terlebih dahulu..."></textarea>
        </div>
        <div id="view-preview" class="view-container">
            <div class="table-wrapper"><table id="previewTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
        </div>
    </div>

<script>
    // Config Kosong (Akan diisi setelah Login)
    let CONFIG = { username: "", repo: "", folder: "", token: "" };
    
    // Variabel Global
    let currentFileName = "";
    let fileSha = "";
    let useSkip4Bytes = false;

    // --- 1. FUNGSI LOGIN & VALIDASI ---
    async function validateAndConnect() {
        const user = document.getElementById('inpUser').value.trim();
        const repo = document.getElementById('inpRepo').value.trim();
        const folder = document.getElementById('inpFolder').value.trim();
        const token = document.getElementById('inpToken').value.trim();
        const btn = document.getElementById('btnLogin');
        const err = document.getElementById('loginError');

        if(!token) { err.style.display = 'block'; err.innerText = "Token wajib diisi!"; return; }

        btn.innerText = "Memeriksa Token...";
        btn.disabled = true;
        err.style.display = 'none';

        // TEST KONEKSI: Coba ambil daftar isi folder
        const testUrl = `https://api.github.com/repos/${user}/${repo}/contents/${folder}`;

        try {
            const response = await fetch(testUrl, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (response.ok) {
                // SUKSES! Simpan Config ke Memory
                CONFIG.username = user;
                CONFIG.repo = repo;
                CONFIG.folder = folder;
                CONFIG.token = token;

                // Buka Kunci Layar
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('repoDisplay').innerText = `${user}/${repo}`;
                
                // Scan File
                fetchFileList();
            } else {
                throw new Error(response.status === 401 ? "Token Salah / Expired!" : "Repo/Folder Tidak Ditemukan (404)");
            }
        } catch (error) {
            err.style.display = 'block';
            err.innerText = "Gagal Login: " + error.message;
            btn.innerText = "Verifikasi & Masuk 🚀";
            btn.disabled = false;
        }
    }

    // --- 2. AUTO SCAN FILE ---
    async function fetchFileList() {
        const listEl = document.getElementById('fileList');
        listEl.innerHTML = `<li style="padding:20px;">Scanning...</li>`;
        
        try {
            const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}`, {
                headers: { 'Authorization': `token ${CONFIG.token}` }
            });
            const data = await response.json();
            const binFiles = data.filter(item => item.name.endsWith(".bin"));

            listEl.innerHTML = "";
            if(binFiles.length === 0) listEl.innerHTML = `<li style="padding:20px; color:orange">Folder Kosong / Tidak ada .bin</li>`;

            binFiles.forEach(file => {
                const li = document.createElement('li');
                li.innerHTML = `<span>📄 ${file.name}</span>`;
                li.onclick = () => loadFile(file.name, li);
                listEl.appendChild(li);
            });
        } catch (err) {
            console.error(err);
            listEl.innerHTML = `<li style="color:red; padding:10px;">Error Scan</li>`;
        }
    }

    // --- 3. LOAD FILE ---
    async function loadFile(filename, element) {
        document.querySelectorAll('li').forEach(l => l.classList.remove('active'));
        element.classList.add('active');
        currentFileName = filename;
        document.getElementById('currentFile').innerText = filename;
        document.getElementById('editor').value = "Loading...";
        
        // Reset Tabel
        document.getElementById('tableHead').innerHTML = "";
        document.getElementById('tableBody').innerHTML = "";

        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}${filename}`, {
                headers: { 'Authorization': `token ${CONFIG.token}` }
            });
            const data = await res.json();
            fileSha = data.sha;

            const binaryString = atob(data.content);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

            let text = "";
            try {
                text = new TextDecoder().decode(pako.inflate(bytes));
                useSkip4Bytes = false;
            } catch (e) {
                text = new TextDecoder().decode(pako.inflate(bytes.subarray(4)));
                useSkip4Bytes = true;
            }

            try {
                const jsonObj = JSON.parse(text);
                document.getElementById('editor').value = JSON.stringify(jsonObj, null, 4);
            } catch(e) { document.getElementById('editor').value = text; }
            
            document.getElementById('saveBtn').disabled = false;
            if(document.getElementById('view-preview').classList.contains('active')) generateSmartTable();

        } catch (err) { document.getElementById('editor').value = "Error: " + err.message; }
    }

    // --- 4. SMART TABLE ---
    function generateSmartTable() {
        const raw = document.getElementById('editor').value;
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = ""; tbody.innerHTML = "";

        try {
            let data = JSON.parse(raw);
            let rows = Array.isArray(data) ? data : (data.files ? data.files : [data]);
            if (rows.length === 0) return;

            let sample = rows[0];
            let hasNested = rows.some(r => r.effects && Array.isArray(r.effects));
            let columns = hasNested ? ["PARENT_ID", "effect", "amount", "chance", "type", "target"] : Object.keys(sample);

            let trHead = document.createElement('tr');
            columns.forEach(col => {
                let th = document.createElement('th');
                th.textContent = col.toUpperCase().replace("_", " ");
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            rows.forEach(row => {
                if (hasNested && row.effects) {
                    row.effects.forEach(eff => {
                        let tr = document.createElement('tr');
                        columns.forEach(col => {
                            let td = document.createElement('td');
                            let val = col === "PARENT_ID" ? (row.id || row.name) : (eff[col] !== undefined ? eff[col] : (row[col] || "-"));
                            td.textContent = val;
                            if(typeof val === 'number') td.classList.add('num');
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                } else {
                    let tr = document.createElement('tr');
                    columns.forEach(col => {
                        let td = document.createElement('td');
                        let val = row[col] !== undefined ? row[col] : "-";
                        if(typeof val === 'object') val = JSON.stringify(val).substring(0,20)+"...";
                        td.textContent = val;
                        if(typeof val === 'number') td.classList.add('num');
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                }
            });
        } catch (e) { tbody.innerHTML = `<tr><td>JSON Error</td></tr>`; }
    }

    // --- 5. SAVE ---
    async function pushToGitHub() {
        const btn = document.getElementById('saveBtn');
        btn.innerText = "SAVING..."; btn.disabled = true;

        try {
            const contentText = document.getElementById('editor').value;
            let textToSave = contentText;
            try { textToSave = JSON.stringify(JSON.parse(contentText)); } catch(e) {}

            const dataBytes = new TextEncoder().encode(textToSave);
            let compressed = pako.deflate(dataBytes);

            if (useSkip4Bytes) {
                const header = new Uint8Array(4);
                const combined = new Uint8Array(4 + compressed.length);
                combined.set(header); combined.set(compressed, 4);
                compressed = combined;
            }

            let binaryString = "";
            for (let i = 0; i < compressed.length; i++) binaryString += String.fromCharCode(compressed[i]);

            const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}${currentFileName}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update ${currentFileName}`, content: btoa(binaryString), sha: fileSha })
            });

            if (res.ok) {
                const r = await res.json();
                fileSha = r.content.sha;
                alert("✅ BERHASIL DISIMPAN!");
            } else throw new Error("Gagal");
        } catch (err) { alert("Error: " + err.message); } 
        finally { btn.innerText = "SAVE KE GITHUB"; btn.disabled = false; }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('view-' + tab).classList.add('active');
        if (tab === 'preview') generateSmartTable();
    }
</script>
</body>
</html>
