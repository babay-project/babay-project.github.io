<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ NS Editor: Auto-Scan & Smart Table</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #30363d; }
        .btn-refresh { background: #1f6feb; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn-refresh:hover { background: #388bfd; }

        .file-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .file-list li { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #21262d; font-size: 13px; display: flex; align-items: center; }
        .file-list li:hover { background: #1f2428; color: #58a6ff; }
        .file-list li.active { background: #1f6feb; color: white; border-left: 4px solid #a371f7; }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* TABS */
        .tabs { display: flex; background: #010409; border-bottom: 1px solid #30363d; }
        .tab-btn { flex: 1; background: transparent; border: none; padding: 15px; color: #8b949e; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #f0f6fc; border-bottom-color: #f78166; background: #0d1117; }

        .toolbar { padding: 10px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        
        /* VIEWS */
        .view-container { flex: 1; display: none; overflow: hidden; }
        .view-container.active { display: flex; flex-direction: column; }

        textarea { flex: 1; background: #0d1117; color: #7ee787; border: none; padding: 20px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; outline: none; }
        
        /* TABLE STYLES */
        .table-wrapper { flex: 1; overflow: auto; padding: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th, td { border: 1px solid #30363d; padding: 8px 12px; text-align: left; white-space: nowrap; }
        th { background: #21262d; color: #f0f6fc; position: sticky; top: 0; z-index: 10; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:nth-child(even) { background: #161b22; }
        tr:hover { background: #232830; }
        .num { color: #79c0ff; }
        .str { color: #a5d6a7; }
        .bool { color: #ff7b72; }

        .btn-save { background: #238636; color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2 style="margin:0; color:#58a6ff;">📂 GUDANG .BIN</h2>
            <small id="repoDisplay" style="color:#8b949e;">Menghubungkan...</small>
            <button class="btn-refresh" onclick="fetchFileList()">🔄 SCAN FOLDER</button>
        </div>
        <ul class="file-list" id="fileList">
            <li style="padding:20px; color:#888; text-align:center;">Klik Scan Folder...</li>
        </ul>
    </div>

    <div class="main">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('editor')">📝 EDITOR (Code)</button>
            <button class="tab-btn" onclick="switchTab('preview')">👁️ TABEL PINTAR (Preview)</button>
        </div>

        <div class="toolbar">
            <div id="currentFile" style="font-weight:bold; color:#79c0ff;">Pilih file...</div>
            <button class="btn-save" onclick="pushToGitHub()" id="saveBtn" disabled>SAVE KE GITHUB</button>
        </div>

        <div id="view-editor" class="view-container active">
            <textarea id="editor" placeholder="Pilih file di kiri untuk mulai edit..."></textarea>
        </div>

        <div id="view-preview" class="view-container">
            <div class="table-wrapper">
                <table id="previewTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // ==========================================
    // ⚙️ CONFIG (CEK LAGI YA!)
    // ==========================================
    const CONFIG = {
        username: "babay-project",                // Username Pemilik Akun
        repo:     "babay-project.github.io", // Nama Repository
        folder:   "lib/",
        token:    "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"
    }; 
    // ==========================================

    document.getElementById('repoDisplay').innerText = `${CONFIG.username}/${CONFIG.repo}`;
    let currentFileName = "";
    let fileSha = "";
    let useSkip4Bytes = false;

    // --- 1. AUTO SCAN FILE ---
    async function fetchFileList() {
        const listEl = document.getElementById('fileList');
        listEl.innerHTML = `<li style="padding:20px;">Scanning...</li>`;

        const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}`;
        
        try {
            const response = await fetch(apiUrl, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);
            
            const data = await response.json();
            const binFiles = data.filter(item => item.name.endsWith(".bin"));

            listEl.innerHTML = ""; 
            if(binFiles.length === 0) listEl.innerHTML = `<li style="padding:20px; color:orange">Tidak ada file .bin</li>`;

            binFiles.forEach(file => {
                const li = document.createElement('li');
                li.innerHTML = `<span>📄 ${file.name}</span>`;
                li.onclick = () => loadFile(file.name, li);
                listEl.appendChild(li);
            });
        } catch (err) {
            listEl.innerHTML = `<li style="color:red; padding:10px;">Gagal Scan: ${err.message}</li>`;
        }
    }
    
    // Auto start scan
    window.onload = fetchFileList;

    // --- 2. LOAD FILE ---
    async function loadFile(filename, element) {
        document.querySelectorAll('li').forEach(l => l.classList.remove('active'));
        element.classList.add('active');
        currentFileName = filename;
        document.getElementById('currentFile').innerText = filename;
        document.getElementById('editor').value = "Loading...";
        document.getElementById('saveBtn').disabled = true;

        // Reset Tabel
        document.getElementById('tableHead').innerHTML = "";
        document.getElementById('tableBody').innerHTML = "";

        const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}${filename}`;

        try {
            const response = await fetch(apiUrl, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            if (!response.ok) throw new Error("Gagal ambil file");
            const data = await response.json();
            fileSha = data.sha;

            const binaryString = atob(data.content);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

            let text = "";
            try {
                text = new TextDecoder().decode(pako.inflate(bytes));
                useSkip4Bytes = false;
            } catch (e) {
                text = new TextDecoder().decode(pako.inflate(bytes.subarray(4)));
                useSkip4Bytes = true;
            }

            try {
                const jsonObj = JSON.parse(text);
                document.getElementById('editor').value = JSON.stringify(jsonObj, null, 4);
            } catch(e) {
                document.getElementById('editor').value = text;
            }
            
            document.getElementById('saveBtn').disabled = false;
            // Jika sedang di tab preview, update tabel langsung
            if(document.getElementById('view-preview').classList.contains('active')) generateSmartTable();

        } catch (err) {
            document.getElementById('editor').value = "Error: " + err.message;
        }
    }

    // --- 3. SMART TABLE GENERATOR ---
    function generateSmartTable() {
        const raw = document.getElementById('editor').value;
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = ""; tbody.innerHTML = "";

        try {
            let data = JSON.parse(raw);
            
            // Normalisasi data: Pastikan jadi Array
            let rows = [];
            if (Array.isArray(data)) {
                rows = data;
            } else if (data.files) {
                rows = data.files;
            } else {
                rows = [data]; // Kalau cuma 1 object
            }

            if (rows.length === 0) {
                tbody.innerHTML = "<tr><td style='padding:20px'>Data Kosong</td></tr>";
                return;
            }

            // A. DETEKSI KOLOM OTOMATIS
            // Kita cek row pertama untuk menentukan judul kolom apa saja yang ada
            let sample = rows[0];
            let columns = [];
            
            // Cek apakah ada nested "effects"? (Kasus Accessory/Weapon)
            let hasNestedEffects = rows.some(r => r.effects && Array.isArray(r.effects));

            if (hasNestedEffects) {
                // Kolom Spesial untuk file tipe Effect
                columns = ["PARENT_ID", "effect", "amount", "chance", "type", "target", "duration"];
            } else {
                // Kolom Standar (Ambil semua key dari object pertama)
                columns = Object.keys(sample);
            }

            // Render Header
            let trHead = document.createElement('tr');
            columns.forEach(col => {
                let th = document.createElement('th');
                th.textContent = col.toUpperCase().replace("_", " ");
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // Render Body
            rows.forEach(row => {
                if (hasNestedEffects && row.effects) {
                    // Loop nested effects
                    row.effects.forEach(eff => {
                        let tr = document.createElement('tr');
                        columns.forEach(col => {
                            let td = document.createElement('td');
                            let val = "";
                            if (col === "PARENT_ID") val = row.id || row.name; // ID Induk
                            else val = eff[col] !== undefined ? eff[col] : (row[col] !== undefined ? row[col] : "-");
                            
                            td.textContent = val;
                            styleCell(td, val);
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                } else {
                    // Render baris biasa
                    let tr = document.createElement('tr');
                    columns.forEach(col => {
                        let td = document.createElement('td');
                        let val = row[col] !== undefined ? row[col] : "-";
                        // Jika value object/array, stringify biar tampil
                        if (typeof val === 'object') val = JSON.stringify(val).substring(0, 30) + "...";
                        
                        td.textContent = val;
                        styleCell(td, val);
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                }
            });

        } catch (e) {
            tbody.innerHTML = `<tr><td style="color:red; padding:20px">Gagal render tabel: JSON tidak valid atau format tidak dikenali.<br><small>${e.message}</small></td></tr>`;
        }
    }

    function styleCell(td, val) {
        if (typeof val === 'number') td.classList.add('num');
        else if (typeof val === 'boolean') td.classList.add('bool');
        else td.classList.add('str');
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById('view-' + tab).classList.add('active');

        if (tab === 'preview') generateSmartTable();
    }

    // --- 4. SAVE FUNCTION ---
    async function pushToGitHub() {
        if (!currentFileName || !fileSha) return;
        const btn = document.getElementById('saveBtn');
        btn.innerText = "MENYIMPAN..."; btn.disabled = true;

        try {
            const contentText = document.getElementById('editor').value;
            // Minify JSON
            let textToSave = contentText;
            try { textToSave = JSON.stringify(JSON.parse(contentText)); } catch(e) {}

            const dataBytes = new TextEncoder().encode(textToSave);
            let compressed = pako.deflate(dataBytes);

            if (useSkip4Bytes) {
                const header = new Uint8Array(4);
                const combined = new Uint8Array(4 + compressed.length);
                combined.set(header); combined.set(compressed, 4);
                compressed = combined;
            }

            let binaryString = "";
            for (let i = 0; i < compressed.length; i++) binaryString += String.fromCharCode(compressed[i]);
            
            const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}${currentFileName}`;
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update ${currentFileName}`, content: btoa(binaryString), sha: fileSha })
            });

            if (response.ok) {
                const res = await response.json();
                fileSha = res.content.sha;
                alert("✅ BERHASIL DISIMPAN!");
            } else throw new Error("Gagal upload");

        } catch (err) { alert("Error: " + err.message); } 
        finally { btn.innerText = "SAVE KE GITHUB"; btn.disabled = false; }
    }
</script>
</body>
</html>
