<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babayshop Nota Generator</title>

    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --input-bg: #262626;
            --border: #333333;
            --accent: #10a37f;
            --accent-hover: #0d8a6a;
            --text-main: #ffffff;
            --text-muted: #8e8ea0;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            padding: 20px;
            background: rgba(26, 26, 26, 0.96);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand {
            color: var(--accent);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        select:focus,
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.12);
        }

        input::placeholder {
            color: #777777;
        }

        .field-space {
            margin-bottom: 12px;
        }

        .helper-text {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 6px;
            display: block;
            line-height: 1.4;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .col {
            flex: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000000;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(16, 163, 127, 0.3);
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            color: white;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        #result-section {
            margin-top: 30px;
            display: none;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        textarea#output {
            width: 100%;
            height: 580px;
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ffffff;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.9rem;
            padding: 15px;
            resize: vertical;
            outline: none;
            line-height: 1.55;
        }

        textarea#output:focus {
            border-color: var(--accent);
        }

        .btn-copy {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-reset {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.08);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 14px;
            }

            .row {
                flex-direction: column;
            }

            textarea#output {
                height: 620px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>BABAYSHOP<span class="brand">.MY.ID</span></h1>
    </header>

    <main class="container">
        <section id="input-form">

            <div class="card">
                <label class="form-label" for="paket">📦 Jenis Paket</label>

                <select id="paket" onchange="toggleFields()">
                    <option value="invite">GPT PRO PLUS — Invite Team</option>
                    <option value="direct">GPT PLUS — Direct Login Private</option>
                    <option value="sharing">GPT PLUS — Sharing 3–5 Orang</option>
                    <option value="go">GPT GO — Max 1 Tahun</option>
                </select>
            </div>

            <div class="card">
                <label class="form-label">📅 Tanggal dan Garansi</label>

                <div class="row">
                    <div class="col">
                        <label class="helper-text" for="custom-date" style="margin-bottom:6px;">
                            Tanggal order
                        </label>
                        <input type="date" id="custom-date">
                    </div>

                    <div class="col">
                        <label class="helper-text" for="garansi-hari" style="margin-bottom:6px;">
                            Garansi berapa hari
                        </label>
                        <input
                            type="number"
                            id="garansi-hari"
                            value="5"
                            min="0"
                            max="365"
                            inputmode="numeric"
                            placeholder="Contoh: 5"
                        >
                    </div>
                </div>

                <small class="helper-text">
                    Tanggal akhir garansi akan dihitung otomatis dari tanggal order.
                </small>
            </div>

            <div id="fields-invite" class="card">
                <label class="form-label" style="color:var(--accent);">
                    👤 Data Invite
                </label>

                <div class="field-space">
                    <input
                        type="email"
                        id="invite-email"
                        placeholder="Email pembeli..."
                        autocomplete="off"
                    >
                </div>

                <div>
                    <input
                        type="text"
                        id="invite-team"
                        placeholder="Nama team / workspace..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <div id="fields-account" class="card hidden">
                <label class="form-label" style="color:var(--accent);">
                    🔐 Data Akun
                </label>

                <div class="field-space">
                    <input
                        type="email"
                        id="direct-email"
                        placeholder="Email akun..."
                        autocomplete="off"
                    >
                </div>

                <div class="field-space">
                    <input
                        type="text"
                        id="direct-pass"
                        placeholder="Password akun..."
                        autocomplete="off"
                    >
                </div>

                <div>
                    <input
                        type="url"
                        id="direct-link"
                        placeholder="Link OTP / MFA (opsional)..."
                        autocomplete="off"
                    >
                </div>

                <small class="helper-text">
                    Isi link OTP/MFA apabila akun memerlukan one-time code saat login.
                </small>
            </div>

            <button class="btn-submit" type="button" onclick="processNote()">
                BUAT NOTA
            </button>
        </section>

        <section id="result-section">
            <div class="result-header">
                <span style="font-weight:bold; color:var(--accent);">
                    HASIL NOTA (Bisa Diedit)
                </span>

                <button
                    class="btn-copy"
                    type="button"
                    onclick="copyToClipboard()"
                    id="btn-copy"
                >
                    Salin
                </button>
            </div>

            <textarea id="output" spellcheck="false"></textarea>

            <button class="btn-reset" type="button" onclick="resetForm()">
                ↺ Buat Baru
            </button>
        </section>
    </main>

    <script>
        const dateInput = document.getElementById("custom-date");

        function getLocalDateString(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        dateInput.value = getLocalDateString();

        function toggleFields() {
            const paket = document.getElementById("paket").value;
            const inviteFields = document.getElementById("fields-invite");
            const accountFields = document.getElementById("fields-account");

            if (paket === "invite") {
                inviteFields.classList.remove("hidden");
                accountFields.classList.add("hidden");
            } else {
                inviteFields.classList.add("hidden");
                accountFields.classList.remove("hidden");
            }
        }

        function parseLocalDate(dateString) {
            if (!dateString) {
                return new Date();
            }

            const parts = dateString.split("-").map(Number);

            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function formatDateID(dateObj) {
            const months = [
                "Januari",
                "Februari",
                "Maret",
                "April",
                "Mei",
                "Juni",
                "Juli",
                "Agustus",
                "September",
                "Oktober",
                "November",
                "Desember"
            ];

            return `${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
        }

        function getWarrantyData() {
            const purchaseDate = parseLocalDate(dateInput.value);
            const warrantyDaysInput = parseInt(
                document.getElementById("garansi-hari").value,
                10
            );

            const warrantyDays = Number.isNaN(warrantyDaysInput)
                ? 0
                : Math.max(0, warrantyDaysInput);

            const warrantyDate = new Date(purchaseDate);
            warrantyDate.setDate(warrantyDate.getDate() + warrantyDays);

            return {
                purchaseDate,
                warrantyDate,
                warrantyDays
            };
        }

        function buildLoginInstruction(linkExists) {
            return `📝 CARA LOGIN:
1. Buka aplikasi atau website ChatGPT.
2. Masukkan email akun langsung di halaman login ChatGPT.
3. Masukkan password yang diberikan.
4. Jika diminta "One-Time Code", buka Link OTP / MFA yang disediakan.
5. Salin kode OTP yang muncul, lalu masukkan kodenya di ChatGPT.
6. Jika tidak diminta kode OTP, lanjutkan login seperti biasa.${linkExists ? "" : "\n\n⚠️ Link OTP / MFA tidak dicantumkan. Hubungi admin jika ChatGPT meminta one-time code."}`;
        }

        function buildWarrantyText(warrantyDays) {
            return `🛡️ GARANSI:
• Garansi selama ${warrantyDays} hari.
• Lebih dari masa garansi, silakan order kembali.`;
        }

        function processNote() {
            const paketVal = document.getElementById("paket").value;
            const warrantyData = getWarrantyData();

            const tglOrder = formatDateID(warrantyData.purchaseDate);
            const tglGaransi = formatDateID(warrantyData.warrantyDate);
            const garansiHari = warrantyData.warrantyDays;

            let itemName = "";
            let typeName = "";
            let accountData = "";
            let instructions = "";

            if (paketVal === "invite") {
                itemName = "AI ChatGPT Pro Plus Invite 1 Bulan";
                typeName = "Private Invite (Team)";

                const email =
                    document.getElementById("invite-email").value.trim() ||
                    "email@user.com";

                const team =
                    document.getElementById("invite-team").value.trim() ||
                    "Team Babayshop";

                accountData =
`▰ Email User : ${email}
▰ Invitation : ${team}`;

                instructions =
`📝 CARA AKTIVASI:
1. Buka email yang didaftarkan.
2. Cari email undangan dari OpenAI / ChatGPT.
3. Klik tombol "Join Team" atau terima undangan team.
4. Masuk ke workspace/team yang sesuai sebelum mulai menggunakan ChatGPT.

⚠️ PENTING:
• Karena menggunakan sistem team, chat dan prompt hanya dapat diakses selama akun masih berada di dalam team.
• Jika team expired, dibubarkan, atau akses dicabut, riwayat chat di dalam workspace tersebut dapat tidak bisa diakses lagi.
• Salin atau backup hasil chat penting sebelum masa aktif paket berakhir.

${buildWarrantyText(garansiHari)}`;

            } else if (paketVal === "direct") {
                itemName = "AI ChatGPT Plus Direct 1 Bulan";
                typeName = "Private Account (Personal)";

                const email =
                    document.getElementById("direct-email").value.trim() || "-";

                const pass =
                    document.getElementById("direct-pass").value.trim() || "-";

                const link =
                    document.getElementById("direct-link").value.trim();

                accountData =
`▰ Email : ${email}
▰ Password : ${pass}`;

                if (link) {
                    accountData += `\n▰ Link OTP / MFA : ${link}`;
                }

                instructions =
`${buildLoginInstruction(Boolean(link))}

📌 KETENTUAN:
• Akun bersifat private/personal.
• Jangan mengganti email, password, atau pengaturan keamanan akun selama masa garansi.
• Apabila akun mengalami kendala selama masa garansi, silakan hubungi admin.

${buildWarrantyText(garansiHari)}`;

            } else if (paketVal === "sharing") {
                itemName = "AI ChatGPT Plus Sharing";
                typeName = "Sharing 3–5 Orang";

                const email =
                    document.getElementById("direct-email").value.trim() || "-";

                const pass =
                    document.getElementById("direct-pass").value.trim() || "-";

                const link =
                    document.getElementById("direct-link").value.trim();

                accountData =
`▰ Email : ${email}
▰ Password : ${pass}`;

                if (link) {
                    accountData += `\n▰ Link OTP / MFA : ${link}`;
                }

                instructions =
`${buildLoginInstruction(Boolean(link))}

📂 INSTRUKSI PAKET SHARING:
• Akun digunakan bersama oleh sekitar 3–5 orang.
• Setiap pengguna mendapatkan Folder / Project masing-masing.
• Sebelum mengisi prompt atau mulai ngobrol dengan AI, masuk ke Folder / Project milik masing-masing terlebih dahulu.
• Hal ini dilakukan supaya chat, prompt, file, dan jawaban AI tidak tercampur dengan pengguna lain.
• Jangan membuka, mengubah, atau menghapus Folder / Project milik pengguna lain.

⚠️ ATURAN PEMAKAIAN:
• Gunakan akun secara normal dan sewajarnya.
• Jangan menggunakan akun secara bar-bar, terlalu memaksa, atau mengirim permintaan terlalu sering.
• Hindari penggunaan berat secara terus-menerus karena akun digunakan bersama pengguna lain.
• Jangan mengganti email, password, nama akun, atau pengaturan keamanan.

${buildWarrantyText(garansiHari)}`;

            } else {
                itemName = "AI ChatGPT Go (Max 1 Tahun)";
                typeName = "Private Account (Personal)";

                const email =
                    document.getElementById("direct-email").value.trim() || "-";

                const pass =
                    document.getElementById("direct-pass").value.trim() || "-";

                const link =
                    document.getElementById("direct-link").value.trim();

                accountData =
`▰ Email : ${email}
▰ Password : ${pass}`;

                if (link) {
                    accountData += `\n▰ Link OTP / MFA : ${link}`;
                }

                instructions =
`${buildLoginInstruction(Boolean(link))}

📌 INFO AKUN:
• Akun bersifat private, bukan sharing.
• Jangan mengganti email, password, atau pengaturan keamanan akun.
• Jika terdapat kendala login selama masa garansi, silakan hubungi admin.

${buildWarrantyText(garansiHari)}`;
            }

            const finalOutput =
`╭────〔 BABAYSHOP.MY.ID 〕────
┊・Item : ${itemName}
┊・Type : ${typeName}
┊・Order Date : ${tglOrder}
┊・Garansi : ${garansiHari} Hari — sampai ${tglGaransi}
╰┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈

📦 DATA AKSES:
${accountData}

╰┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈

${instructions}

🌐 Info lengkap:
https://babayshop.my.id/gpt/`;

            document.getElementById("output").value = finalOutput;

            const resultSection = document.getElementById("result-section");
            resultSection.style.display = "block";
            resultSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

        async function copyToClipboard() {
            const copyText = document.getElementById("output");
            const button = document.getElementById("btn-copy");

            try {
                await navigator.clipboard.writeText(copyText.value);
            } catch (error) {
                copyText.select();
                copyText.setSelectionRange(0, copyText.value.length);
                document.execCommand("copy");
            }

            button.innerText = "Sudah Disalin!";
            button.style.background = "var(--accent)";
            button.style.color = "#000000";

            setTimeout(() => {
                button.innerText = "Salin";
                button.style.background = "#ffffff";
                button.style.color = "#000000";
            }, 2000);
        }

        function resetForm() {
            document.getElementById("result-section").style.display = "none";
            document.getElementById("invite-email").value = "";
            document.getElementById("invite-team").value = "";
            document.getElementById("direct-email").value = "";
            document.getElementById("direct-pass").value = "";
            document.getElementById("direct-link").value = "";
            document.getElementById("output").value = "";
            document.getElementById("custom-date").value = getLocalDateString();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        toggleFields();
    </script>
</body>
</html>
