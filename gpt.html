<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Babayshop Nota Generator Final</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --input-bg: #262626;
            --border: #333;
            --accent: #10a37f;
            --accent-hover: #0d8a6a;
            --text-main: #ffffff;
            --text-muted: #8e8ea0;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            padding: 20px;
            background: rgba(26, 26, 26, 0.95);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
        }

        h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
        .brand { color: var(--accent); }

        .container {
            max-width: 600px; /* Fokus mobile layout */
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        select:focus, input:focus { border-color: var(--accent); }

        /* Button Group */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(16, 163, 127, 0.3);
            transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); }

        /* Result Section */
        #result-section {
            margin-top: 30px;
            display: none; /* Hidden by default */
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        textarea#output {
            width: 100%;
            height: 480px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            padding: 15px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        
        textarea#output:focus {
            border-color: var(--accent);
        }

        .btn-copy {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-reset {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Utilities */
        .hidden { display: none; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

    </style>
</head>
<body>

    <header>
        <h1>BABAYSHOP<span class="brand">.MY.ID</span></h1>
    </header>

    <div class="container">
        <div id="input-form">
            <div class="card">
                <label class="form-label">📦 JENIS PAKET</label>
                <select id="paket" onchange="toggleFields()">
                    <option value="invite">GPT PRO PLUS (Invite Team)</option>
                    <option value="direct">GPT PLUS (Direct Login)</option>
                    <option value="go">GPT GO (Max 1 Tahun)</option>
                </select>
            </div>

            <div class="card">
                <label class="form-label">📅 TANGGAL ORDER</label>
                <input type="date" id="custom-date">
                <small style="color:var(--text-muted); font-size:0.75rem; margin-top:5px; display:block;">
                    *Garansi otomatis dihitung +23 Hari dari tanggal ini.
                </small>
            </div>

            <div id="fields-invite" class="card">
                <label class="form-label" style="color:var(--accent);">👤 DATA INVITE</label>
                <div style="margin-bottom:12px;">
                    <input type="email" id="invite-email" placeholder="Email Pembeli...">
                </div>
                <div>
                    <input type="text" id="invite-team" placeholder="Nama Tim...">
                </div>
            </div>

            <div id="fields-direct" class="card hidden">
                <label class="form-label" style="color:var(--accent);">🔐 DATA AKUN</label>
                <div style="margin-bottom:12px;">
                    <input type="email" id="direct-email" placeholder="Email Akun...">
                </div>
                <div style="margin-bottom:12px;">
                    <input type="text" id="direct-pass" placeholder="Password...">
                </div>
                <div>
                    <input type="text" id="direct-link" placeholder="Link Akses (Opsional)...">
                </div>
            </div>

            <button class="btn-submit" onclick="processNote()">BUAT NOTA</button>
        </div>

        <div id="result-section">
            <div class="result-header">
                <span style="font-weight:bold; color:var(--accent);">HASIL NOTA (Bisa Diedit)</span>
                <button class="btn-copy" onclick="copyToClipboard()" id="btn-copy">Salin</button>
            </div>
            
            <textarea id="output" spellcheck="false"></textarea>
            
            <button class="btn-reset" onclick="resetForm()">↺ Buat Baru</button>
        </div>

    </div>

    <script>
        // Set Default Date Today
        document.getElementById('custom-date').valueAsDate = new Date();

        // Toggle Form
        function toggleFields() {
            const paket = document.getElementById('paket').value;
            if (paket === 'invite') {
                document.getElementById('fields-invite').classList.remove('hidden');
                document.getElementById('fields-direct').classList.add('hidden');
            } else {
                document.getElementById('fields-invite').classList.add('hidden');
                document.getElementById('fields-direct').classList.remove('hidden');
            }
        }

        // Format Date Indo
        function formatDateID(dateObj) {
            const months = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];
            return `${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
        }

        // --- CORE PROCESS FUNCTION ---
        function processNote() {
            const paketVal = document.getElementById('paket').value;
            
            // Date Calculation
            let purchaseDate = new Date(document.getElementById('custom-date').value);
            let warrantyDate = new Date(purchaseDate);
            warrantyDate.setDate(purchaseDate.getDate() + 23); // LOGIKA 23 HARI

            const tglOrder = formatDateID(purchaseDate);
            const tglGaransi = formatDateID(warrantyDate);

            // Variables
            let itemName = "";
            let typeName = "";
            let accountData = "";
            let instructions = "";

            // LOGIC CONTENT
            if (paketVal === 'invite') {
                itemName = "AI Chat GPT Pro Plus Invite 1 Bulan";
                typeName = "Private Invite (Team)";
                
                const email = document.getElementById('invite-email').value || "email@user.com";
                const team = document.getElementById('invite-team').value || "Team Babay";
                
                accountData = `▰ Email User : ${email}\n▰ Invitation : ${team}`;

                instructions = `⚠️ PENTING (BACA):
1. Cek email dari OpenAI/ Chatgpt, klik "Join Team".
2. Karena ini sistem TIM, chat history & prompt HANYA TERSIMPAN selama anda di dalam tim.
3. JIKA SUDAH EXPIRED/NONAKTIF, semua chat history akan HILANG dan tidak bisa diakses lagi.
👉 JADI... WAJIB BACKUP/COPY hasil chat penting sebelum masa aktif habis.

🛡️ KLAIM GARANSI:
* Garansi invite ulang jika tim bubar sebelum 23 hari.
* Lewat masa garansi silakan order kembali.`;

            } else if (paketVal === 'direct') {
                itemName = "AI Chat GPT Plus Direct 1 Bulan";
                typeName = "Private Account (Personal)";
                
                const email = document.getElementById('direct-email').value || "-";
                const pass = document.getElementById('direct-pass').value || "-";
                const link = document.getElementById('direct-link').value;
                
                accountData = `▰ Email : ${email}\n▰ Password : ${pass}`;
                if(link) accountData += `\n▰ Link Akses : ${link}`;

                instructions = `📝 INSTRUKSI:
1. Login langsung di chat.openai.com.
2. Akun Private (Milik Sendiri).
3. Dilarang ganti email/password agar garansi valid.

🛡️ KLAIM GARANSI:
* Garansi Full 23 Hari ganti akun jika error/back to free.`;

            } else { // GO
                itemName = "AI Chat GPT Go (Max 1 Tahun)";
                typeName = "Private Account (Personal)";
                
                const email = document.getElementById('direct-email').value || "-";
                const pass = document.getElementById('direct-pass').value || "-";
                
                accountData = `▰ Email : ${email}\n▰ Password : ${pass}`;

                instructions = `📝 INFO AKUN:
1. Login menggunakan data di atas.
2. Akun Private, bukan shared.

ℹ️ STATUS:
* Paket Hemat (GO), jika ada kendala login silakan hubungi admin.`;
            }

            // --- ASSEMBLING THE FINAL TEXT ---
            let finalOutput = `╭────〔 BABAYSHOP.MY.ID 〕─
┊・Item : ${itemName}
┊・Type : ${typeName}
┊・Order Date : ${tglOrder}
┊・Garansi : ${paketVal === 'go' ? 'Max 1 Tahun' : tglGaransi}
╰┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈
📦 DATA AKSES PRIVAT :
${accountData}
╰┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈
${instructions}

🌐 Info lengkap: https://babayshop.my.id/gpt/`;

            // Insert to Textarea
            document.getElementById('output').value = finalOutput;

            // Show Result
            const resultSection = document.getElementById('result-section');
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Copy Function
        function copyToClipboard() {
            const copyText = document.getElementById("output");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value).then(() => {
                const btn = document.getElementById("btn-copy");
                btn.innerText = "Sudah Disalin!";
                btn.style.background = "var(--accent)";
                setTimeout(() => {
                    btn.innerText = "Salin";
                    btn.style.background = "#fff";
                }, 2000);
            });
        }

        // Reset Function
        function resetForm() {
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('invite-email').value = '';
            document.getElementById('invite-team').value = '';
            document.getElementById('direct-email').value = '';
            document.getElementById('direct-pass').value = '';
            document.getElementById('direct-link').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Init
        toggleFields();
    </script>
</body>
</html>
